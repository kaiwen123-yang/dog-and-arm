# P6 simulated single door. Arm/door geometry starts from p4_pull_60, leg and wheel servos from p5.
cone: elliptic
impratio: 10
solver_tolerance: 1.0e-10
travel_turn_limit_rad_s: 0.36
stance_yaw_limit_deg: 16
pull_retreat_world_direction: [1, 0, 0]  # subtract this vector times stand-off on front release
travel_m: 0.30
small_angle_deg: 15
angle_tolerance_deg: 2
angle_rate_deg_s: 1.8
angle_accel_ramp_s: 1.5
closed_command_width_m: 0.010
angle_lead_deg: 0.30
grip_net_force_limit_n: 6.0  # about 2.5 x the 15-degree measured peak; simulation diagnostic
settle_speed_m_s: 0.005
settle_yaw_rate_deg_s: 0.5
settle_time_s: 1
position_tol_m: 0.02
heading_tol_deg: 2
tilt_limit_deg: 5
contact_threshold_n: 0.01
wheel_threshold_n: 1.0
unloaded_limit_s: 0.10
grasp_confirm_s: 0.20
loss_limit_s: 0.15
grasp_error_m: 0.005
grasp_width_range_m: [0.012, 0.035]
sat_fraction: 0.98
sat_limit_s: 0.25
park_slip_limit_m_s: 0.025
park_slip_limit_s: 0.20
post_hold_s: 3
tracking_tol_m: 0.003
sample_hz: 25
phase_ramp_s: {pregrasp: 5, dry_sweep: 16, approach_arm: 3, grasp: 2, hold: 0.5, release: 1.5, retreat_arm: 3, stow: 5}
phase_timeout_s: {approach_base: 32, settle: 7, pregrasp: 9, dry_sweep: 20, approach_arm: 7, grasp: 5, open: 55, hold: 7, release: 6, retreat_arm: 8, post_release_hold: 8, stow: 10, retreat_base: 32, final: 8}
