worlds: 8
wm_batch: 32
wm_batches: 10
actor_batch: 16
wm_hidden: [2048, 2048, 2048]
actor_hidden: [2048, 1024, 512, 256]
critic_hidden: [256, 128]
buffer_size: 1000
replay_ratio: 16
physics_dt: 0.002
policy_dt: 0.020
