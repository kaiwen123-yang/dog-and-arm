# Keep study B's data/boundary treatment. The O1 G1 source scales positions by
# 0.25 * force limit / position gain and uses home offsets. Generalize the
# same rule to wheel (velocity gain) and full jaw width (2x linear change).
window_recipe: terminal_one_step_and_seven_step
one_step_batches: 2
network_output_units: quarter_effort_over_servo_gain
additional_physical_checks: [50, 200]
hypothesis: Scaling network outputs and 0.1 exploration in O1 actuator-effort units will keep early legs loaded while preserving physical action ranges, 7 s tracking accuracy and the original O1 reward are evaluated separately.
